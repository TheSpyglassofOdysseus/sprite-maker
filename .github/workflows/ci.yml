name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        env:
          REPOSITORY: ${{ github.repository }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          TARGET_SHA="${PR_HEAD_SHA:-$EVENT_SHA}"
          git fetch --depth=1 origin "$TARGET_SHA"
          git checkout --detach FETCH_HEAD
          echo "Testing $(git rev-parse HEAD)"
      - name: Install Bun
        run: |
          npm install --global bun
          bun --version
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build

  native:
    name: Rust tests and Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        env:
          REPOSITORY: ${{ github.repository }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          TARGET_SHA="${PR_HEAD_SHA:-$EVENT_SHA}"
          git fetch --depth=1 origin "$TARGET_SHA"
          git checkout --detach FETCH_HEAD
          echo "Testing $(git rev-parse HEAD)"
      - name: Configure Rust
        run: |
          rustup default stable
          rustup component add rustfmt clippy
          rustc --version
          cargo --version
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-targets
      - name: Run Clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  windows-bundle:
    name: Windows installer smoke build
    runs-on: windows-latest
    steps:
      - name: Check out exact revision
        shell: pwsh
        env:
          REPOSITORY: ${{ github.repository }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/$env:REPOSITORY.git"
          $target = if ($env:PR_HEAD_SHA) { $env:PR_HEAD_SHA } else { $env:EVENT_SHA }
          git fetch --depth=1 origin $target
          git checkout --detach FETCH_HEAD
          git rev-parse HEAD
      - name: Configure Rust
        shell: pwsh
        run: |
          rustup default stable
          rustc --version
          cargo --version
      - name: Install Bun
        shell: pwsh
        run: |
          npm install --global bun
          bun --version
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run tauri build
      - name: Record Windows installers
        shell: pwsh
        run: |
          Get-ChildItem -Recurse src-tauri/target/release/bundle -File | Where-Object { $_.Extension -in '.exe','.msi' } | ForEach-Object { Write-Host $_.FullName }
