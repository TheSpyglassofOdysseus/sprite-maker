name: Dependency lock refresh

on:
  pull_request:

concurrency:
  group: dependency-lock-refresh-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh-and-audit:
    name: Regenerate lockfile and audit dependency graph
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact review head
        env:
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --depth=1 origin "$HEAD_SHA"
          git checkout -B "$HEAD_BRANCH" FETCH_HEAD
          echo "Refreshing dependencies at $(git rev-parse HEAD)"
      - name: Regenerate Bun lockfile and audit JavaScript dependencies
        run: |
          npm install --global bun
          bun install
          bun audit
      - name: Audit Rust dependencies with RustSec
        run: |
          rustup default stable
          cargo install cargo-audit --locked
          cd src-tauri
          cargo audit
      - name: Commit audited lockfile if changed
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already matches the audited dependency graph"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "Refresh audited Bun lockfile [skip ci]"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git"
          git push origin "HEAD:${HEAD_BRANCH}"
