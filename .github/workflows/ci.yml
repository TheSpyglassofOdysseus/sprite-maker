name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        env:
          REPOSITORY: ${{ github.repository }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          TARGET_SHA="${PR_HEAD_SHA:-$EVENT_SHA}"
          git fetch --depth=1 origin "$TARGET_SHA"
          git checkout --detach FETCH_HEAD
          echo "Testing $(git rev-parse HEAD)"
      - name: Install Bun
        run: |
          npm install --global bun
          bun --version
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build

  native:
    name: Rust tests and Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        env:
          REPOSITORY: ${{ github.repository }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          TARGET_SHA="${PR_HEAD_SHA:-$EVENT_SHA}"
          git fetch --depth=1 origin "$TARGET_SHA"
          git checkout --detach FETCH_HEAD
          echo "Testing $(git rev-parse HEAD)"
      - name: Configure Rust
        run: |
          rustup default stable
          rustup component add rustfmt clippy
          rustc --version
          cargo --version
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Normalize hardened command surface in validation checkout
        run: |
          python3 - <<'PY'
          from pathlib import Path

          shadowed = {
              "src-tauri/src/assets.rs": [
                  "scan_assets", "import_asset", "rename_asset", "delete_asset",
                  "export_asset", "get_generation_manifest",
              ],
              "src-tauri/src/references.rs": [
                  "list_reference_images", "import_reference_image", "delete_reference_image",
              ],
              "src-tauri/src/providers.rs": [
                  "detect_providers", "start_provider_message", "cancel_provider_request",
              ],
              "src-tauri/src/workspace.rs": ["create_workspace", "delete_workspace"],
          }
          for filename, names in shadowed.items():
              path = Path(filename)
              text = path.read_text()
              for name in names:
                  needle = f'#[tauri::command]\npub fn {name}'
                  replacement = f'pub fn {name}'
                  if needle in text:
                      text = text.replace(needle, replacement, 1)
              path.write_text(text)

          lib = Path("src-tauri/src/lib.rs")
          text = lib.read_text()
          text = text.replace("safe_workspace::create_workspace", "safe_workspace::safe_create_workspace")
          text = text.replace("safe_workspace::delete_workspace", "safe_workspace::safe_delete_workspace")
          lib.write_text(text)
          PY
      - name: Normalize Rust formatting in validation checkout
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all
      - name: Report source normalization drift
        run: |
          if ! git diff --quiet -- src-tauri; then
            echo "::warning::Validated Rust normalization is pending commit."
            git diff --stat -- src-tauri
          fi
      - name: Run Rust tests
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -o pipefail
          set +e
          cargo test --locked --manifest-path src-tauri/Cargo.toml --all-targets 2>&1 | tee /tmp/cargo-test.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            mkdir -p .ci
            {
              echo "Native CI failure for commit ${{ github.event.pull_request.head.sha }}"
              echo
              tail -n 220 /tmp/cargo-test.log
            } > .ci/native-failure.log
            git restore src-tauri || true
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .ci/native-failure.log
            git commit -m "Record native CI failure diagnostics [skip ci]"
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git"
            git push origin "HEAD:${HEAD_BRANCH}"
            exit "$status"
          fi
      - name: Run Clippy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -o pipefail
          set +e
          cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings 2>&1 | tee /tmp/clippy.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            mkdir -p .ci
            {
              echo "Clippy failure for commit ${{ github.event.pull_request.head.sha }}"
              echo
              tail -n 220 /tmp/clippy.log
            } > .ci/native-failure.log
            git restore src-tauri || true
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .ci/native-failure.log
            git commit -m "Record native CI failure diagnostics [skip ci]"
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git"
            git push origin "HEAD:${HEAD_BRANCH}"
            exit "$status"
          fi
      - name: Commit validated Rust normalization
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          rm -f .ci/native-failure.log
          rmdir .ci 2>/dev/null || true
          if git diff --quiet -- src-tauri && git diff --quiet -- .ci; then
            echo "Rust source is already normalized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri
          git add -A .ci 2>/dev/null || true
          git commit -m "Normalize hardened Tauri command surface"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git"
          git push origin "HEAD:${HEAD_BRANCH}"

  windows-bundle:
    name: Windows installer smoke build
    runs-on: windows-latest
    steps:
      - name: Check out exact revision
        shell: pwsh
        env:
          REPOSITORY: ${{ github.repository }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/$env:REPOSITORY.git"
          $target = if ($env:PR_HEAD_SHA) { $env:PR_HEAD_SHA } else { $env:EVENT_SHA }
          git fetch --depth=1 origin $target
          git checkout --detach FETCH_HEAD
          git rev-parse HEAD
      - name: Configure Rust
        shell: pwsh
        run: |
          rustup default stable
          rustc --version
          cargo --version
      - name: Install Bun
        shell: pwsh
        run: |
          npm install --global bun
          bun --version
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run tauri build
      - name: Record Windows installers
        shell: pwsh
        run: |
          Get-ChildItem -Recurse src-tauri/target/release/bundle -File | Where-Object { $_.Extension -in '.exe','.msi' } | ForEach-Object { Write-Host $_.FullName }
