name: Sprite Studio Quality

on:
  push:
    branches:
      - main
      - "review/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Frontend and Rust quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source revision
        env:
          REPOSITORY: ${{ github.repository }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          TARGET_SHA="${PR_HEAD_SHA:-$EVENT_SHA}"
          git fetch --depth=1 origin "$TARGET_SHA"
          git checkout --detach FETCH_HEAD
          echo "Testing commit $(git rev-parse HEAD)"

      - name: Configure Rust toolchain
        run: |
          rustup default stable
          rustup component add rustfmt clippy
          rustc --version
          cargo --version

      - name: Install Bun
        run: |
          npm install --global bun
          bun --version

      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Check Svelte and TypeScript
        run: bun run check

      - name: Verify Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Run Clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
