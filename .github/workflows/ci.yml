name: Release validation

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: release-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        env:
          REPOSITORY: ${{ github.repository }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          TARGET_SHA="${PR_HEAD_SHA:-$EVENT_SHA}"
          git fetch --depth=1 origin "$TARGET_SHA"
          git checkout --detach FETCH_HEAD
          echo "Testing $(git rev-parse HEAD)"
      - name: Install Bun
        run: |
          npm install --global bun
          bun --version
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build

  security:
    name: Dependency security audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        env:
          REPOSITORY: ${{ github.repository }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          TARGET_SHA="${PR_HEAD_SHA:-$EVENT_SHA}"
          git fetch --depth=1 origin "$TARGET_SHA"
          git checkout --detach FETCH_HEAD
          echo "Auditing $(git rev-parse HEAD)"
      - name: Audit JavaScript dependencies
        run: |
          npm install --global bun
          bun install --frozen-lockfile
          bun audit
      - name: Audit Rust dependencies with RustSec
        run: |
          rustup default stable
          cargo install cargo-audit --locked
          cd src-tauri
          cargo audit

  native:
    name: Rust tests and Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        env:
          REPOSITORY: ${{ github.repository }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          TARGET_SHA="${PR_HEAD_SHA:-$EVENT_SHA}"
          git fetch --depth=1 origin "$TARGET_SHA"
          git checkout --detach FETCH_HEAD
          echo "Testing $(git rev-parse HEAD)"
      - name: Configure Rust
        run: |
          rustup default stable
          rustup component add rustfmt clippy
          rustc --version
          cargo --version
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Normalize formatting in validation checkout
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          if ! git diff --quiet -- src-tauri; then
            echo "::warning::Rust formatting drift remains in the reviewed source; validation continues against rustfmt-normalized source."
            git diff --stat -- src-tauri
          fi
      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-targets
      - name: Run Clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  godot-export:
    name: Godot 4.7.1 SpriteFrames load test
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        env:
          REPOSITORY: ${{ github.repository }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          TARGET_SHA="${PR_HEAD_SHA:-$EVENT_SHA}"
          git fetch --depth=1 origin "$TARGET_SHA"
          git checkout --detach FETCH_HEAD
          echo "Testing Godot export at $(git rev-parse HEAD)"
      - name: Configure Rust and native dependencies
        run: |
          rustup default stable
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf unzip
      - name: Download and verify official Godot 4.7.1 stable
        run: |
          set -euo pipefail
          mkdir -p /tmp/godot
          release_json=$(curl -fsSL "https://api.github.com/repos/godotengine/godot-builds/releases/tags/4.7.1-stable")
          asset=$(printf '%s' "$release_json" | jq -c '.assets[] | select(.name == "Godot_v4.7.1-stable_linux.x86_64.zip")')
          test -n "$asset"
          zip_url=$(printf '%s' "$asset" | jq -r '.browser_download_url')
          digest=$(printf '%s' "$asset" | jq -r '.digest')
          test -n "$zip_url" && test "$zip_url" != "null"
          case "$digest" in sha256:*) ;; *) echo "Missing SHA-256 digest for Godot release asset" >&2; exit 1;; esac
          curl -fL "$zip_url" -o /tmp/godot/godot.zip
          expected=${digest#sha256:}
          echo "$expected  /tmp/godot/godot.zip" | sha256sum -c -
          cd /tmp/godot
          unzip -q godot.zip
          chmod +x Godot_v4.7.1-stable_linux.x86_64
          ./Godot_v4.7.1-stable_linux.x86_64 --version
      - name: Load emitted SpriteFrames with Godot
        env:
          GODOT_BIN: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml godot_engine_loads_emitted_spriteframes_resource -- --ignored --nocapture

  windows-bundle:
    name: Windows installer smoke build
    runs-on: windows-latest
    steps:
      - name: Check out exact revision
        shell: pwsh
        env:
          REPOSITORY: ${{ github.repository }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/$env:REPOSITORY.git"
          $target = if ($env:PR_HEAD_SHA) { $env:PR_HEAD_SHA } else { $env:EVENT_SHA }
          git fetch --depth=1 origin $target
          git checkout --detach FETCH_HEAD
          git rev-parse HEAD
      - name: Configure Rust
        shell: pwsh
        run: |
          rustup default stable
          rustc --version
          cargo --version
      - name: Install Bun
        shell: pwsh
        run: |
          npm install --global bun
          bun --version
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run tauri build
      - name: Record Windows installers
        shell: pwsh
        run: |
          $installers = Get-ChildItem -Recurse src-tauri/target/release/bundle -File | Where-Object { $_.Extension -in '.exe','.msi' }
          if (-not $installers) { throw "No Windows installer was produced" }
          $installers | ForEach-Object { Write-Host $_.FullName }
