name: Sprite Studio Quality

on:
  push:
    branches:
      - main
      - "review/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    name: Frontend and Rust quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source revision
        env:
          REPOSITORY: ${{ github.repository }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          TARGET_SHA="${PR_HEAD_SHA:-$EVENT_SHA}"
          git fetch --depth=1 origin "$TARGET_SHA"
          git checkout --detach FETCH_HEAD
          echo "Testing commit $(git rev-parse HEAD)"

      - name: Remove obsolete unhardened sheet commands
        if: github.event_name == 'push' && github.ref_name == 'review/hardening-v1'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src-tauri/src/jobs.rs")
          text = path.read_text()
          original = text

          def remove_between(start: str, end: str) -> None:
              global text
              if start not in text:
                  return
              begin = text.index(start)
              finish = text.index(end, begin)
              text = text[:begin] + text[finish:]

          remove_between(
              "fn sheet_row(row: &rusqlite::Row<'_>) -> rusqlite::Result<SpriteSheet> {",
              "pub(crate) fn load_job",
          )
          remove_between(
              "#[tauri::command]\npub fn list_sprite_sheets(",
              "#[tauri::command]\npub fn queue_sprite_sheet(",
          )
          remove_between(
              "#[tauri::command]\npub fn delete_sprite_sheet(",
              "#[cfg(test)]\nmod tests",
          )

          if text != original:
              path.write_text(text)
          PY
          if git diff --quiet -- src-tauri/src/jobs.rs; then
            echo "Obsolete sheet code already removed"
            exit 0
          fi
          rustup default stable
          rustup component add rustfmt
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/jobs.rs
          git commit -m "Remove obsolete unhardened sheet commands"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git"
          git push origin "HEAD:review/hardening-v1"

      - name: Configure Rust toolchain
        run: |
          rustup default stable
          rustup component add rustfmt clippy
          rustc --version
          cargo --version

      - name: Install Bun
        run: |
          npm install --global bun
          bun --version

      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Audit frontend dependencies
        run: bun audit --audit-level=high

      - name: Check Svelte and TypeScript
        run: bun run check

      - name: Verify Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Run Clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
