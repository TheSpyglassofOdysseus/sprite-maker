name: One-time Rustfmt Fix

on:
  push:
    branches:
      - review/hardening-v1

permissions:
  contents: write

jobs:
  format:
    name: Normalize committed Rust formatting
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        env:
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --depth=1 origin "$BRANCH"
          git checkout -B "$BRANCH" FETCH_HEAD

      - name: Configure Rust formatter
        run: |
          rustup default stable
          rustup component add rustfmt

      - name: Format and commit if needed
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          if git diff --quiet -- src-tauri; then
            echo "Rust source already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri
          git commit -m "Apply rustfmt to hardened Rust source"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git"
          git push origin "HEAD:${BRANCH}"
